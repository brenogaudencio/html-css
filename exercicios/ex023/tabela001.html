<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
            text-align: center;
            font-weight: bolder;
            margin: auto;
        }
        td {
            background-color: rgb(80, 236, 150);
            border: 3px dashed black;
            padding: 8px;
            color: rgb(20, 85, 20);
            font-size: 1.5em;
            font-variant: small-caps;
        }

        .numero {
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!-- Hierarquia de tabelas (simples)
    table = tabela
        table row = linha da tabela 
            table header = cabeçalho da tabela
            table data = dados da tabela -->
    <table>
        <tr><!-- primeira linha -->
            <td>a1</td>
            <td>b1</td>
            <td>c1</td>
        </tr>
        <tr><!-- segunda linha -->
            <td>a2</td>
            <td>b2</td>
            <td class="numero">c2</td>
        </tr>
        <tr><!-- terceira linha -->
            <td>a3</td>
            <td>b3</td>
            <td class="numero">c3</td>
        </tr>
    </table>
</body>
</html>
