<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <link rel="stylesheet" href="estilo/style.css">
</head>
<body>
    <h1>Uso de Tabelas Grandes</h1>
    <!-- ANATOMIA PARA TABELAS Grandes
    TABLE 
        THEAD 
            TR, TD, TH
        TBODY 
            TR, TD, TH
        TFOOT
            TR, TD, TH  -->
    <table>
        <thead>
            <tr>
                <th>Estado</th>
                <th>População</th>
            </tr>
      </thead>
      <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">45.919.049</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">45.919.049</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="num">17.219.679</td>
            </tr>
            <tr>
                <td>Santa Catarina</td>
                <td class="num">7.056.495</td>
            </tr>
      </tbody>
      <tfoot>
            <th>Total de Habitantes</th>
            <td class="num"><strong>91.518.031</strong></td>      
      </tfoot>
    </table>

</body>
</html>
