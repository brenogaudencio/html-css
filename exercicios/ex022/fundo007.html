<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento vertical</title>
    <style>
        #container {
            height: 96vh;
            background: black url(imagens/wallpaper002.jpg) center center no-repeat fixed;
            background-size: cover;
            position: relative;
        }

        #conteudo {
            height: 800px;
            width: 400px;
            background-color: white;
            background-size: 100% 100%;
            position: absolute;

            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            border: 1px solid black;
            border-radius: 5px;
        }
        .login {
            background-color: blue;
            border: 1px solid black;
            color: white;
            padding: 15px;
            border-radius: 5px;
            width: 50px;
            text-align: center;
            
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        .cadastrar {
            background-color: blue;
            border: 1px solid black;
            color: white;
            padding: 15px;
            border-radius: 5px;
            width: 50px;
            text-align: center;
            
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -170%);
        }
        </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">
            <div class="login">login</div>
            <div class="cadastrar">cadastrar</div>
        </article>
    </section>
</body>
</html>
